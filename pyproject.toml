[project]
name = "echorag"
version = "0.1.0"
description = "Voice-enabled RAG over MSMARCO-XI with a sub-200ms retrieval SLO"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "lancedb>=0.15",
    "datasets>=3.0",
]

# Phase 1+ deps (lancedb, onnxruntime, tokenizers) are added in their phase,
# not now — see AUDIT.md §13.

[project.optional-dependencies]
# Dev/learning only. Pulls torch (~2GB) for a readable API while learning.
# The deployed server never installs this — it runs ONNX int8 (AUDIT.md D2).
learn = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echorag"]
