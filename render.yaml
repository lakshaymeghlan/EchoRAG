# Render Blueprint. Connect this repo at dashboard.render.com/blueprints and
# Render reads this instead of asking you to fill in forms.
#
# Free plan is 512 MB / 0.1 CPU, and measured peak RSS is ~850 MB, so this may
# not fit. Deploying anyway because it costs nothing and is the only way to get
# a real Linux number — local measurements are macOS, which has no cgroups.
#
# Points at the 7,492-passage shard, not the full 99,985. Not because a smaller
# corpus saves RSS (measured: it does not — the floor is onnxruntime + model +
# lancedb, not the corpus) but because on Linux the memmapped index counts as
# page cache against the container limit, and it boots 13x faster: 58 MB
# instead of 723 MB over a 0.1-CPU link.
#
# The full-corpus numbers in bench/results.md were measured locally and remain
# the reference result — see README.
services:
  - type: web
    name: echorag
    runtime: docker
    plan: free
    region: singapore # closest Render region to India
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ECHORAG_INDEX_REPO
        value: lakshaymeghlan/echorag-index-small
      - key: ECHORAG_GENERATOR
        value: none # extractive only; nothing to hallucinate
      - key: SARVAM_API_KEY
        sync: false # set in the dashboard, never in git
